name: Android beta release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build beta APK
        run: ./gradlew assembleDebug
        env:
          TUNETALK_API_BASE_URL: ${{ vars.TUNETALK_API_BASE_URL }}

      - name: Attach beta APK to release
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
